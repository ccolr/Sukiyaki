name: Build Surge Rules

on:
  schedule:
    - cron: "0 22 * * *"
  push:
    paths:
      - "MyRule/**.conf"
      - "Surge_Modules/**"
      - "Tool/classify_batch.txt"
      - "Tool/batch.txt"
      - "Tool/surge_classify.py"
      - "Tool/surge_merge.py"
      - "Tool/surge_modules.txt"
      - "Tool/fetch_modules.py"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sukiyaki
        uses: actions/checkout@v4
        with:
          path: Sukiyaki
          token: ${{ secrets.RULE_REPO_TOKEN }}

      - name: Checkout Rule
        uses: actions/checkout@v4
        with:
          repository: ccolr/Rule
          token: ${{ secrets.RULE_REPO_TOKEN }}
          path: Rule

      - name: Merge rules into this repo's Rule/
        working-directory: Sukiyaki
        run: |
          python3 Tool/surge_merge.py \
            -b Tool/batch.txt \
            -o ./Rule

      - name: Commit Rule/ changes in this repo
        working-directory: Sukiyaki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Rule/
          if git diff --cached --quiet; then
            echo "Rule/ unchanged, skipping commit"
          else
            git commit -m "Auto-merge: $(date -u '+%Y-%m-%d %H:%M UTC') [${{ github.event_name }}]"
            git push
          fi

      - name: Build rule sets into the external Rule repo
        working-directory: Sukiyaki
        run: |
          python3 Tool/surge_classify.py \
            -b Tool/classify_batch.txt \
            -o ../Rule

      - name: Fetch Surge modules into Surge_Modules/
        working-directory: Sukiyaki
        run: |
          python3 Tool/fetch_modules.py \
            -i Tool/surge_modules.txt \
            -o ./Surge_Modules

      - name: Sync Surge_Modules/ to the Rule repo
        run: |
          mkdir -p Rule/Surge_Modules
          rsync -a Sukiyaki/Surge_Modules/ Rule/Surge_Modules/

      - name: Push to the Rule repo
        run: |
          cd Rule
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Surge/ Surge_Modules/
          git diff --cached --quiet && echo "No changes, skipping push" && exit 0
          git commit -m "Auto-build: $(date -u '+%Y-%m-%d %H:%M UTC') [${{ github.event_name }}]"
          git push

      - name: Trigger Vercel redeploy
        if: success()
        run: curl -X POST "${{ secrets.RULE_DEPLOY_HOOK }}"
